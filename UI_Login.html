<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Cat Bracelet</title>
    <link rel="stylesheet" href="UI_Login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <i class="fas fa-arrow-left"></i>
                <span>Quay lại</span>
            </div>
            <div class="header-right">
                <div class="logo">
                    <div class="logo-icon"><img src="image/logo_Cat.jpg" alt="logo"></div>
                    <span class="logo-text">CAT BRACELET</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Welcome Section -->
            <div class="welcome-section">
                <h1 class="welcome-title">Chào mừng trở lại</h1>
                <p class="welcome-subtitle">Vui lòng đăng nhập để tiếp tục</p>
            </div>

            <!-- Login Form -->
            <div class="login-form">
                <div class="input-section">
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" class="form-input" placeholder="Tài khoản" autocomplete="username">
                    </div>
                </div>

                <div class="input-section">
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-input" placeholder="Mật khẩu" autocomplete="current-password">
                    </div>
                </div>

                <div class="error-message" id="errorMessage"></div>

                <button class="login-btn" id="loginBtn">
                    <span>Đăng nhập</span>
                </button>
            </div>

            <!-- Benefits Section -->
            <div class="benefits-section">
                <h3 class="benefits-title">Lợi ích khi đăng nhập/đăng ký Cat Bracelet</h3>
                <div class="benefits-list">
                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fas fa-circle"></i>
                        </div>
                        <span class="benefit-text">Dễ dàng tra cứu thông tin sản phẩm và đơn hàng</span>
                    </div>
                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fas fa-circle"></i>
                        </div>
                        <span class="benefit-text">Xem lịch sử mua hàng và theo dõi đơn hàng</span>
                    </div>
                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fas fa-circle"></i>
                        </div>
                        <span class="benefit-text">Nhận được ưu đãi và khuyến mãi độc quyền</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Xử lý đăng nhập
        const loginBtn = document.getElementById('loginBtn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');

        // Hàm đăng nhập
        function handleLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // Xóa thông báo lỗi cũ
            errorMessage.textContent = '';
            errorMessage.style.display = 'none';

            // Kiểm tra tài khoản và mật khẩu
            if (username === '123' && password === '123') {
                // Đăng nhập thành công
                alert('Đăng nhập thành công!');
                // Có thể chuyển hướng đến trang khác ở đây
                // window.location.href = 'dashboard.html';
            } else {
                // Hiển thị thông báo lỗi
                errorMessage.textContent = 'Tài khoản hoặc mật khẩu không đúng!';
                errorMessage.style.display = 'block';
                
                // Thêm hiệu ứng shake
                loginBtn.classList.add('shake');
                setTimeout(() => {
                    loginBtn.classList.remove('shake');
                }, 500);
            }
        }

        // Sự kiện click nút đăng nhập
        loginBtn.addEventListener('click', handleLogin);

        // Sự kiện nhấn Enter trong ô input
        usernameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });
    </script>
</body>
</html>
